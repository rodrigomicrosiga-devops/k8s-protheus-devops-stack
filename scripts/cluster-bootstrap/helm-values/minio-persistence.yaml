# Overlay SEM segredo, combinado com minio.yaml (cifrado) pelo Helm:
#   helm upgrade --install minio minio/minio -f minio.yaml -f minio-persistence.yaml
# Separado do arquivo cifrado de propósito -- assim mudar configuração não
# exige decriptar/recriptar as credenciais (ADR 0011).
# Pré-requisito: ../backup/minio-storage.yaml aplicado.
persistence:
  enabled: true
  existingClaim: minio-backup-pvc

# Achado real (drill do zero, 2026-09-21): o default do chart pede
# resources.requests.memory: 16Gi -- dimensionado pra MinIO distribuído de
# produção, não cabe em nenhum dos dois nodes deste cluster local (pod fica
# Pending, "Insufficient memory"). MinIO standalone servindo um único bucket
# de backup local não precisa disso.
resources:
  requests:
    memory: 256Mi
  limits:
    memory: 512Mi
