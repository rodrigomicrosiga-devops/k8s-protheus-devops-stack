# Drop-in do docker.service: só sobe o Docker depois que o disco de dados estiver
# montado. Ver docs/adr/0018-docker-espera-disco-de-dados-no-boot.md pro porquê.
#
# Sem isso, depois de uma queda de energia o Docker subiu os nodes do k3d ANTES de
# /media/rodrigo/dados montar (o fstab tem `nofail`, então o systemd não ordena
# nada em relação a ele) e o bind mount do k8s-volume apontou pra pasta vazia do
# disco raiz -- Postgres sem montar o PV, dbaccess em loop, pods em Unknown.
#
# Instalação (no host, uma vez):
#   sudo install -d -m 0755 /etc/systemd/system/docker.service.d
#   sudo install -m 0644 scripts/k3d-nodes/docker-wait-data-mount.conf \
#     /etc/systemd/system/docker.service.d/wait-data-mount.conf
#   sudo systemctl daemon-reload
#
# RequiresMountsFor= = Requires= + After= na unit de mount do caminho. Se o disco
# NÃO montar (disco ausente/defeituoso), o Docker não sobe -- é de propósito: um
# Docker "saudável" com o k8s-volume vazio é pior que um Docker parado.
[Unit]
RequiresMountsFor=/media/rodrigo/dados
