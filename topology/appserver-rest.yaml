# AppServer "rest" -- expõe o barramento REST API do Protheus. Mesma imagem
# do core, papel diferente via command. Só sobe depois do appserver-core
# validado (Fase D, posterior à Fase C no plano).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: appserver-rest
  namespace: protheus-devops
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: appserver-rest
  template:
    metadata:
      labels:
        app: appserver-rest
    spec:
      initContainers:
        - name: wait-for-rpo
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Aguardando RPO oficial em /totvs/protheus/apo/tttm120.rpo..."
              until [ -s /totvs/protheus/apo/tttm120.rpo ]; do
                sleep 5
              done
              echo "RPO presente, liberando o AppServer REST."
          volumeMounts:
            - mountPath: /totvs/protheus/apo
              name: protheus-apo
      containers:
        - name: appserver-rest
          image: rodrigomicrosiga/appserver-dev:24.3.1.9
          args: ["rest"]
          env:
            - name: ENV_NAME
              value: "protheus"
            - name: APP_PORT_MULTI
              value: "1235"
            - name: LICENSE_SERVER
              value: "license-service"
            - name: LICENSE_SERVER_PORT
              value: "5555"
            - name: DBACCESS_SERVER
              value: "dbaccess-service"
            - name: DBACCESS_PORT
              value: "7890"
            - name: RPO_CUSTOM_NAME
              value: "custom"
            - name: REST_HTTP_PORT
              value: "8400"
            - name: REST_URI
              value: "/rest"
            - name: REST_PREP_ENV
              value: "99,01"
            - name: REST_INSTANCES
              value: "1,1"
          envFrom:
            - configMapRef:
                name: postgres-config
          ports:
            - containerPort: 1235
              name: multi
            - containerPort: 8400
              name: http-rest
          readinessProbe:
            tcpSocket:
              port: 8400
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8400
            initialDelaySeconds: 30
            periodSeconds: 15
          volumeMounts:
            - mountPath: /totvs/protheus/apo
              name: protheus-apo
            - mountPath: /totvs/protheus/system
              name: protheus-system
            - mountPath: /totvs/protheus/data
              name: protheus-data
            - mountPath: /totvs/protheus/log
              name: protheus-log
            - mountPath: /tmp/webapp_shared
              name: webapp-shared
              readOnly: true
            - mountPath: /tmp/printer_shared
              name: printer-shared
              readOnly: true
            - mountPath: /tmp/webagent_shared
              name: webagent-shared
              readOnly: true
      volumes:
        - name: protheus-apo
          persistentVolumeClaim:
            claimName: protheus-apo-pvc
        - name: protheus-system
          persistentVolumeClaim:
            claimName: protheus-system-pvc
        - name: protheus-data
          persistentVolumeClaim:
            claimName: protheus-data-pvc
        - name: protheus-log
          persistentVolumeClaim:
            claimName: protheus-log-pvc
        - name: webapp-shared
          persistentVolumeClaim:
            claimName: webapp-shared-pvc
        - name: printer-shared
          persistentVolumeClaim:
            claimName: printer-shared-pvc
        - name: webagent-shared
          persistentVolumeClaim:
            claimName: webagent-shared-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: appserver-rest-service
  namespace: protheus-devops
spec:
  type: NodePort
  selector:
    app: appserver-rest
  ports:
    - name: multi
      protocol: TCP
      port: 1235
      targetPort: 1235
      nodePort: 31235
    - name: http-rest
      protocol: TCP
      port: 8400
      targetPort: 8400
      nodePort: 30840
