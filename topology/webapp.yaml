# Sidecar de entrega: não expõe porta nenhuma, só extrai o binário do WebApp
# (versão independente, atualizável sem tocar no AppServer) para um volume
# compartilhado. Montado somente-leitura por appserver-core/-rest/-telnet em
# /tmp/webapp_shared -- espelha o /tmp/webapp_shared:ro do docker-compose
# original.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: webapp-shared-pv
spec:
  storageClassName: local-path
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /media/rodrigo/dados/k8s-volume/webapp-shared
  # nodeAffinity declarada desde o nascimento do PV (recriado do zero em
  # 2026-09-18 especificamente pra isso -- ver ADR 0004 e ADR 0012).
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k3d-protheus-cluster-agent-0
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: webapp-shared-pvc
  namespace: protheus-devops
spec:
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  volumeName: webapp-shared-pv
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
  namespace: protheus-devops
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      # O container principal roda non-root (imagem migrada em 2026-07-27), mas
      # o hostPath é auto-criado pelo kubelet como root:root 0755 na primeira
      # vez que o Pod é agendado num node -- sem esse init container, o usuário
      # não-root não consegue escrever no volume (só o root consegue).
      initContainers:
        - name: fix-shared-volume-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chmod 0777 /mnt/webapp_shared"]
          volumeMounts:
            - mountPath: /mnt/webapp_shared
              name: webapp-shared
      containers:
        - name: webapp
          image: rodrigomicrosiga/webapp-dev:10.2.1
          # Só readiness, sem liveness: se o arquivo não foi provisionado,
          # reiniciar o container não resolve (o entrypoint roda uma vez só
          # e não falha se o instalador não tiver o webapp.so).
          readinessProbe:
            exec:
              command: ["test", "-f", "/mnt/webapp_shared/webapp.so"]
            initialDelaySeconds: 10
            periodSeconds: 15
          volumeMounts:
            - mountPath: /mnt/webapp_shared
              name: webapp-shared
      volumes:
        - name: webapp-shared
          persistentVolumeClaim:
            claimName: webapp-shared-pvc
