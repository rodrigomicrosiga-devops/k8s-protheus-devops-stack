apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: protheus-devops-stack
  namespace: argocd
spec:
  applicationRefs:
    - namePattern: protheus-devops-stack
      writeBackConfig:
        method: argocd
      images:
        - alias: dbaccess
          imageName: docker.io/rodrigomicrosiga/dbaccess-dev:24.1.1.3
          commonUpdateSettings:
            updateStrategy: digest
          manifestTargets:
            kustomize:
              name: rodrigomicrosiga/dbaccess-dev
        - alias: postgres
          imageName: docker.io/rodrigomicrosiga/postgres-dev:16
          commonUpdateSettings:
            updateStrategy: digest
          manifestTargets:
            kustomize:
              name: rodrigomicrosiga/postgres-dev
        - alias: license
          imageName: docker.io/rodrigomicrosiga/license-dev:3.7.1
          commonUpdateSettings:
            updateStrategy: digest
          manifestTargets:
            kustomize:
              name: rodrigomicrosiga/license-dev
        - alias: webapp
          imageName: docker.io/rodrigomicrosiga/webapp-dev:10.2.1
          commonUpdateSettings:
            updateStrategy: digest
          manifestTargets:
            kustomize:
              name: rodrigomicrosiga/webapp-dev
        - alias: printer
          imageName: docker.io/rodrigomicrosiga/printer-dev:3.0.5
          commonUpdateSettings:
            updateStrategy: digest
          manifestTargets:
            kustomize:
              name: rodrigomicrosiga/printer-dev
        - alias: smartview
          imageName: docker.io/rodrigomicrosiga/smartview-dev:3.9.0
          commonUpdateSettings:
            updateStrategy: digest
          manifestTargets:
            kustomize:
              name: rodrigomicrosiga/smartview-dev
        # Fase D (2026-09-17): appserver-core/-rest/-telnet compartilham a mesma imagem --
        # uma entrada só cobre os três (o transformer de imagem do Kustomize aplica por nome,
        # não por Deployment).
        - alias: appserver
          imageName: docker.io/rodrigomicrosiga/appserver-dev:24.3.1.5
          commonUpdateSettings:
            updateStrategy: digest
          manifestTargets:
            kustomize:
              name: rodrigomicrosiga/appserver-dev
        # As 3 imagens de seed do AppServer (protheus-seed.yaml, Fase C). RPO tem uma única
        # imagem por release (12.1.2510 = um RPO só, pra sempre) -- diferente de
        # system/systemload, que recebem várias atualizações dentro do mesmo release. Rastrear
        # via digest é seguro nos três: a tag fica fixa até o dev decidir subir de release
        # (mudança deliberada no git), nunca pula sozinho pra um release novo.
        - alias: protheus-rpo-seed
          imageName: docker.io/rodrigomicrosiga/protheus-rpo-dev:12.1.2510
          commonUpdateSettings:
            updateStrategy: digest
          manifestTargets:
            kustomize:
              name: rodrigomicrosiga/protheus-rpo-dev
        - alias: protheus-system-seed
          imageName: docker.io/rodrigomicrosiga/protheus-system-dev:12.1.2510
          commonUpdateSettings:
            updateStrategy: digest
          manifestTargets:
            kustomize:
              name: rodrigomicrosiga/protheus-system-dev
        - alias: protheus-systemload-seed
          imageName: docker.io/rodrigomicrosiga/protheus-systemload-dev:12.1.2510
          commonUpdateSettings:
            updateStrategy: digest
          manifestTargets:
            kustomize:
              name: rodrigomicrosiga/protheus-systemload-dev
        # appserver-dev-worker (Fase E: worker/compile prontos em 2026-09-17, ver
        # base/appserver-worker-job.yaml e base/appserver-compile-job.yaml) continua de fora
        # de propósito -- os dois Jobs existem, mas ficam deliberadamente FORA de
        # base/kustomization.yaml (nunca aplicados automaticamente pelo Argo CD, ver
        # comentário nos próprios arquivos). Sem entrar no Kustomize, não há manifesto
        # rastreado pro Image Updater mirar -- a entrada continuaria inerte. Quando a tag da
        # imagem mudar, atualizar manualmente `image:` nos dois Jobs (mesmo fluxo do
        # scripts/appserver-patch/, edição deliberada, não automação).
