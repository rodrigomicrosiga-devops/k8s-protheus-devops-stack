# TEMPORÁRIO (ADR 0021): a versão Go da API rodando AO LADO da Python, só para validar ao vivo com a
# MESMA ServiceAccount (logo, o mesmo RBAC) antes da troca. Sem Service, sem NodePort: acesso por
# `kubectl port-forward deployment/protheus-manager-api-preview`. Removido no cutover.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: protheus-manager-api-preview
  namespace: protheus-devops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: protheus-manager-api-preview
  template:
    metadata:
      labels:
        app: protheus-manager-api-preview
    spec:
      serviceAccountName: protheus-manager
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: protheus-manager-api-preview
          image: rodrigomicrosiga/protheus-manager-api-dev:go-preview
          imagePullPolicy: Always
          ports:
            - containerPort: 8800
          env:
            - name: MANAGER_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: MANAGER_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: manager-secret
                  key: MANAGER_API_TOKEN
            # As DUAS APIs protegidas: nenhuma das duas pode parar a outra por engano durante a validação.
            - name: MANAGER_PROTECTED_SERVICES
              value: protheus-manager-api,protheus-manager-api-preview
            - name: DB_HOST
              value: postgres-service
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: DB_USER
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: DB_NAME
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DB_PASS
          readinessProbe:
            httpGet:
              path: /health
              port: 8800
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8800
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
