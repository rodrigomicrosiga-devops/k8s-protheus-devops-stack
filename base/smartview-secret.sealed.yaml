---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: smartview-secret
  namespace: protheus-devops
  annotations:
    # Precisa ser aplicado (e decodificado pelo controller) antes do Job de
    # bootstrap (smartview-db-init-job.yaml), que referencia esta secret via
    # secretKeyRef -- por isso tambem e hook PreSync, numa wave anterior.
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-1"
spec:
  encryptedData:
    SV_PASS: 
  template:
    metadata:
      name: smartview-secret
      namespace: protheus-devops
