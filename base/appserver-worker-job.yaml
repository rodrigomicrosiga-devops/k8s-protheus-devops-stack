# AppServer "worker" -- aplica patches .ptm da fila (/totvs/protheus/patches_queue)
# sobre o .rpo compartilhado. Papel efêmero (Fase E), NÃO um Deployment.
#
# DELIBERADAMENTE FORA de base/kustomization.yaml: este Job nunca deve ser
# aplicado automaticamente pelo sync do Argo CD.
#   1. selfHeal:true sem ignoreDifferences na Application reverteria qualquer
#      scale-to-zero de core/rest/telnet feito por fora do git -- por isso a
#      parada deles tem que ser via commit (replicas: 0) + sync, nunca
#      `kubectl scale` direto (ver docs/adr/0006, e a prática real de
#      2026-09-16 registrada no HANDOFF).
#   2. Hooks Argo CD (PreSync/PostSync) re-rodam a cada sync (ADR 0003),
#      inclusive syncs disparados pelo Image Updater -- incompatível com a
#      regra mais cara do projeto (CLAUDE.md): worker/compile/upddistr NUNCA
#      rodam antes do bootstrap manual do AppServer estar completo. Isso não
#      pode ser automático.
#
# Uso: sempre via scripts/appserver-patch/run-job.sh worker (nunca
# `kubectl apply` direto neste arquivo -- o script cuida de parar
# core/rest/telnet antes e religar depois, na ordem certa).
apiVersion: batch/v1
kind: Job
metadata:
  name: appserver-worker
  namespace: protheus-devops
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: appserver-worker
    spec:
      restartPolicy: Never
      # rodrigomicrosiga/appserver-dev-worker nunca tinha sido puxada neste
      # node antes -- pull anônimo do Docker Hub esbarrou no rate limit
      # (429) depois das recriações de node de hoje. Credencial autenticada
      # (mesma usada pelos seeds) tem quota bem maior, evita o problema.
      imagePullSecrets:
        - name: regcred
      initContainers:
        - name: prepare-volumes
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Aguardando RPO oficial em /totvs/protheus/apo/tttm120.rpo..."
              until [ -s /totvs/protheus/apo/tttm120.rpo ]; do
                sleep 5
              done
              echo "RPO presente."
              # kubelet cria o hostPath como root:root 0755 no primeiro mount
              # -- mesmo tratamento de protheus-seed.yaml/webapp.yaml/printer.yaml.
              mkdir -p /totvs/protheus/patches_queue/applied /totvs/protheus/patches_queue/error
              chmod -R 0777 /totvs/protheus/patches_queue
          volumeMounts:
            - mountPath: /totvs/protheus/apo
              name: protheus-apo
            - mountPath: /totvs/protheus/patches_queue
              name: protheus-patches
      containers:
        - name: appserver-worker
          image: rodrigomicrosiga/appserver-dev-worker:24.3.1.5
          args: ["worker"]
          env:
            - name: ENV_NAME
              value: "protheus"
            # DB_NAME/DB_TYPE literais em vez de envFrom: configMapRef: postgres-config --
            # o nome real do ConfigMap sai com um hash (`configMapGenerator`, ex.
            # postgres-config-b7k44b4dt8) que o Kustomize só reescreve pra recursos
            # listados em kustomization.yaml. Este Job fica de propósito fora dele
            # (ver comentário no topo do arquivo), então nunca veria o nome certo --
            # mesmo motivo/solução já usada em smartview-db-init-job.yaml.
            - name: DB_NAME
              value: "protheus"
            - name: DB_TYPE
              value: "POSTGRES"
            - name: LICENSE_SERVER
              value: "license-service"
            - name: LICENSE_SERVER_PORT
              value: "5555"
            - name: DBACCESS_SERVER
              value: "dbaccess-service"
            - name: DBACCESS_PORT
              value: "7890"
            - name: RPO_CUSTOM_NAME
              value: "custom"
          # Sem privileged/cap_add/SYS_RAWIO/dev-mem na primeira versão --
          # mesmo princípio do appserver-core.yaml: só adiciona se um teste
          # real provar necessidade, não por analogia com o docker-compose.
          volumeMounts:
            - mountPath: /totvs/protheus/apo
              name: protheus-apo
            - mountPath: /totvs/protheus/system
              name: protheus-system
            - mountPath: /totvs/protheus/systemload
              name: protheus-systemload
            - mountPath: /totvs/protheus/log
              name: protheus-log
            - mountPath: /totvs/protheus/patches_queue
              name: protheus-patches
      volumes:
        - name: protheus-apo
          persistentVolumeClaim:
            claimName: protheus-apo-pvc
        - name: protheus-system
          persistentVolumeClaim:
            claimName: protheus-system-pvc
        - name: protheus-systemload
          persistentVolumeClaim:
            claimName: protheus-systemload-pvc
        - name: protheus-log
          persistentVolumeClaim:
            claimName: protheus-log-pvc
        - name: protheus-patches
          persistentVolumeClaim:
            claimName: protheus-patches-pvc
