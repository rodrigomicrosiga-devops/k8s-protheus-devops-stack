apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - postgres.yaml
  - dbaccess.yaml
  - postgres-secret.sealed.yaml

# Gerador dinâmico de ConfigMaps (variáveis comuns)
configMapGenerator:
  - name: postgres-config
    namespace: protheus-devops
    envs:
      - postgres.env

# postgres-secret agora vem de postgres-secret.sealed.yaml (Sealed Secrets),
# não mais de um secretGenerator local — o segredo real nunca fica em texto no git.
# Requer o controller bitnami/sealed-secrets instalado no cluster de destino.