# protheus-manager-api (repo irmão protheus-manager-api, desenho no ADR 0019).
# Fase 2: leitura + escrita de baixo risco. Cada permissão abaixo existe por UMA ação da
# API e está comentada com ela -- a Role só cresce junto com a fase, nunca antes, e nunca
# vira cluster-admin. Fase 3 (Jobs) vai pedir `jobs` create/delete aqui. Stateless: sem volume, então RollingUpdate padrão (diferente dos
# componentes com hostPath, ver README "Estratégia de Rollout").
apiVersion: v1
kind: ServiceAccount
metadata:
  name: protheus-manager
  namespace: protheus-devops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: protheus-manager
  namespace: protheus-devops
rules:
  # Leitura (GET /services, /logs)
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # POST /services/{name}/stop|start -- só a subresource `scale`: NÃO dá `patch` em
  # `deployments`, que permitiria trocar imagem/env/volumes (RBAC não filtra por campo).
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch", "update"]
  # POST /services/{name}/restart -- apaga pods e o Deployment os recria.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: protheus-manager
  namespace: protheus-devops
subjects:
  - kind: ServiceAccount
    name: protheus-manager
    namespace: protheus-devops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: protheus-manager
---
# GET /gitops, POST /gitops/sync|refresh -- restrito por resourceNames ao ÚNICO Application
# deste ambiente (get/patch aceitam resourceNames; list não, e a API não lista).
# Aceito e documentado (ADR 0019): `patch` num Application permite alterar o spec dele.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: protheus-manager-gitops
  namespace: argocd
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    resourceNames: ["protheus-devops-stack"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: protheus-manager-gitops
  namespace: argocd
subjects:
  - kind: ServiceAccount
    name: protheus-manager
    namespace: protheus-devops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: protheus-manager-gitops
---
# GET/POST /backups -- cria Backup e lê o template do Schedule (só o protheus-daily).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: protheus-manager-backups
  namespace: velero
rules:
  - apiGroups: ["velero.io"]
    resources: ["backups"]
    verbs: ["get", "list", "create"]
  - apiGroups: ["velero.io"]
    resources: ["schedules"]
    resourceNames: ["protheus-daily"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: protheus-manager-backups
  namespace: velero
subjects:
  - kind: ServiceAccount
    name: protheus-manager
    namespace: protheus-devops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: protheus-manager-backups
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: protheus-manager-api
  namespace: protheus-devops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: protheus-manager-api
  template:
    metadata:
      labels:
        app: protheus-manager-api
    spec:
      serviceAccountName: protheus-manager
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: protheus-manager-api
          image: rodrigomicrosiga/protheus-manager-api-dev:0.3.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8800
          env:
            - name: MANAGER_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: MANAGER_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: manager-secret
                  key: MANAGER_API_TOKEN
            # Banco só para leitura de nomes de tabela (portão do bootstrap). Mesmo usuário
            # da aplicação; a senha vem do postgres-secret que já existe.
            - name: DB_HOST
              value: postgres-service
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: DB_USER
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: DB_NAME
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DB_PASS
          readinessProbe:
            httpGet:
              path: /health
              port: 8800
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8800
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          # Contraste deliberado com o ADR 0001 (license/smartview privilegiados): esta API
          # não precisa de nada além de falar HTTP e chamar o API server.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
# NodePort 30880 -> exposto em 127.0.0.1:8800 pelo serverlb (ADR 0017, ver
# scripts/cluster-bootstrap/00-create-cluster.sh). Só loopback: nada na rede.
apiVersion: v1
kind: Service
metadata:
  name: protheus-manager-api-service
  namespace: protheus-devops
spec:
  type: NodePort
  selector:
    app: protheus-manager-api
  ports:
    - protocol: TCP
      port: 8800
      targetPort: 8800
      nodePort: 30880
