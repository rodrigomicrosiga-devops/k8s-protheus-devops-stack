# protheus-manager-api (repo irmão protheus-manager-api, desenho no ADR 0019).
# Fase 2: leitura + escrita de baixo risco. Cada permissão abaixo existe por UMA ação da
# API e está comentada com ela -- a Role só cresce junto com a fase, nunca antes, e nunca
# vira cluster-admin. Fase 3 (Jobs) vai pedir `jobs` create/delete aqui. Desde a auditoria durável (0.5.0, ADR 0023 §7) deixou de ser
# stateless: tem um PV próprio para a trilha (protheus-manager-audit-pv) e por isso `Recreate`
# (ADR 0002), como os demais componentes com volume local.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: protheus-manager
  namespace: protheus-devops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: protheus-manager
  namespace: protheus-devops
rules:
  # Leitura (GET /services, /logs)
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # POST /services/{name}/stop|start -- só a subresource `scale`: NÃO dá `patch` em
  # `deployments`, que permitiria trocar imagem/env/volumes (RBAC não filtra por campo).
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch", "update"]
  # POST /services/{name}/restart -- apaga pods e o Deployment os recria.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: protheus-manager
  namespace: protheus-devops
subjects:
  - kind: ServiceAccount
    name: protheus-manager
    namespace: protheus-devops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: protheus-manager
---
# GET /gitops, POST /gitops/sync|refresh -- restrito por resourceNames ao ÚNICO Application
# deste ambiente (get/patch aceitam resourceNames; list não, e a API não lista).
# Aceito e documentado (ADR 0019): `patch` num Application permite alterar o spec dele.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: protheus-manager-gitops
  namespace: argocd
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    resourceNames: ["protheus-devops-stack"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: protheus-manager-gitops
  namespace: argocd
subjects:
  - kind: ServiceAccount
    name: protheus-manager
    namespace: protheus-devops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: protheus-manager-gitops
---
# GET/POST /backups -- cria Backup e lê o template do Schedule (só o protheus-daily).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: protheus-manager-backups
  namespace: velero
rules:
  - apiGroups: ["velero.io"]
    resources: ["backups"]
    verbs: ["get", "list", "create"]
  - apiGroups: ["velero.io"]
    resources: ["schedules"]
    resourceNames: ["protheus-daily"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: protheus-manager-backups
  namespace: velero
subjects:
  - kind: ServiceAccount
    name: protheus-manager
    namespace: protheus-devops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: protheus-manager-backups
---
# Trilha de auditoria durável do manager (JSONL append-only, ADR 0023 §7). `local` + Retain +
# nodeAffinity desde o nascimento (ADR 0004). O diretório PRECISA existir antes, com dono do
# usuário do container (10001; fsGroup não age em volume local) -- passo do HOST, de quem opera:
#   docker exec k3d-protheus-cluster-agent-0 sh -c 'mkdir -p /media/rodrigo/dados/k8s-volume/protheus-manager-audit && chown 10001:10001 /media/rodrigo/dados/k8s-volume/protheus-manager-audit && chmod 0700 /media/rodrigo/dados/k8s-volume/protheus-manager-audit'
# Se o diretório não existir ou não estiver montado, a API responde 503 nas ações mutantes (falha
# fechada) em vez de gravar no disco efêmero do container.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: protheus-manager-audit-pv
spec:
  storageClassName: local-path
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  local:
    path: /media/rodrigo/dados/k8s-volume/protheus-manager-audit
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k3d-protheus-cluster-agent-0
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: protheus-manager-audit-pvc
  namespace: protheus-devops
spec:
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  volumeName: protheus-manager-audit-pv
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: protheus-manager-api
  namespace: protheus-devops
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: protheus-manager-api
  template:
    metadata:
      labels:
        app: protheus-manager-api
      annotations:
        # Velero: o volume da trilha entra no backup (opt-in por volume, como postgres-dumps).
        backup.velero.io/backup-volumes: audit
    spec:
      serviceAccountName: protheus-manager
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: protheus-manager-api
          image: rodrigomicrosiga/protheus-manager-api-dev:0.5.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8800
          env:
            - name: MANAGER_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: MANAGER_AUDIT_FILE
              value: /data/audit/audit.jsonl
            - name: MANAGER_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: manager-secret
                  key: MANAGER_API_TOKEN
            # Banco só para leitura de nomes de tabela (portão do bootstrap). Mesmo usuário
            # da aplicação; a senha vem do postgres-secret que já existe.
            - name: DB_HOST
              value: postgres-service
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: DB_USER
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: DB_NAME
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DB_PASS
          volumeMounts:
            - name: audit
              mountPath: /data/audit
          readinessProbe:
            httpGet:
              path: /health
              port: 8800
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8800
            initialDelaySeconds: 10
            periodSeconds: 20
          # Go (ADR 0021): medido em 7 MiB de uso; a versão Python usava 89 MiB e pedia 64Mi/256Mi.
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
          # Contraste deliberado com o ADR 0001 (license/smartview privilegiados): esta API
          # não precisa de nada além de falar HTTP e chamar o API server. A imagem é distroless
          # (sem shell), então nem um atacante com execução teria o que usar.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: audit
          persistentVolumeClaim:
            claimName: protheus-manager-audit-pvc
---
# NodePort 30880 -> exposto em 127.0.0.1:8800 pelo serverlb (ADR 0017, ver
# scripts/cluster-bootstrap/00-create-cluster.sh). Só loopback: nada na rede.
apiVersion: v1
kind: Service
metadata:
  name: protheus-manager-api-service
  namespace: protheus-devops
spec:
  type: NodePort
  selector:
    app: protheus-manager-api
  ports:
    - protocol: TCP
      port: 8800
      targetPort: 8800
      nodePort: 30880
