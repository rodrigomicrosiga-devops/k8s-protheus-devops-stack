# AppServer "telnet" -- console de administração via TELNET (SIGAACD). Mesma
# imagem do core, papel diferente via command. Só sobe depois do
# appserver-core validado (Fase D, posterior à Fase C no plano).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: appserver-telnet
  namespace: protheus-devops
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: appserver-telnet
  template:
    metadata:
      labels:
        app: appserver-telnet
    spec:
      initContainers:
        - name: wait-for-rpo
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Aguardando RPO oficial em /totvs/protheus/apo/tttm120.rpo..."
              until [ -s /totvs/protheus/apo/tttm120.rpo ]; do
                sleep 5
              done
              echo "RPO presente, liberando o AppServer TELNET."
          volumeMounts:
            - mountPath: /totvs/protheus/apo
              name: protheus-apo
      containers:
        - name: appserver-telnet
          image: rodrigomicrosiga/appserver-dev:24.3.1.9
          args: ["telnet"]
          env:
            - name: ENV_NAME
              value: "protheus"
            - name: APP_PORT_MULTI
              value: "1236"
            - name: LICENSE_SERVER
              value: "license-service"
            - name: LICENSE_SERVER_PORT
              value: "5555"
            - name: DBACCESS_SERVER
              value: "dbaccess-service"
            - name: DBACCESS_PORT
              value: "7890"
            - name: RPO_CUSTOM_NAME
              value: "custom"
            - name: TELNET_PORT
              value: "23"
          envFrom:
            - configMapRef:
                name: postgres-config
          ports:
            - containerPort: 1236
              name: multi
            - containerPort: 23
              name: telnet
          readinessProbe:
            tcpSocket:
              port: 23
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 23
            initialDelaySeconds: 30
            periodSeconds: 15
          volumeMounts:
            - mountPath: /totvs/protheus/apo
              name: protheus-apo
            - mountPath: /totvs/protheus/system
              name: protheus-system
            - mountPath: /totvs/protheus/data
              name: protheus-data
            - mountPath: /totvs/protheus/log
              name: protheus-log
            - mountPath: /tmp/webapp_shared
              name: webapp-shared
              readOnly: true
            - mountPath: /tmp/printer_shared
              name: printer-shared
              readOnly: true
      volumes:
        - name: protheus-apo
          persistentVolumeClaim:
            claimName: protheus-apo-pvc
        - name: protheus-system
          persistentVolumeClaim:
            claimName: protheus-system-pvc
        - name: protheus-data
          persistentVolumeClaim:
            claimName: protheus-data-pvc
        - name: protheus-log
          persistentVolumeClaim:
            claimName: protheus-log-pvc
        - name: webapp-shared
          persistentVolumeClaim:
            claimName: webapp-shared-pvc
        - name: printer-shared
          persistentVolumeClaim:
            claimName: printer-shared-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: appserver-telnet-service
  namespace: protheus-devops
spec:
  type: NodePort
  selector:
    app: appserver-telnet
  ports:
    - name: multi
      protocol: TCP
      port: 1236
      targetPort: 1236
      nodePort: 31236
    - name: telnet
      protocol: TCP
      port: 23
      targetPort: 23
      nodePort: 30023
