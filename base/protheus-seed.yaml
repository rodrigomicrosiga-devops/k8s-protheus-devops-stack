          image: rodrigomicrosiga/protheus-systemload-dev:12.1.2510
          volumeMounts:
            - mountPath: /mnt/systemload
              name: protheus-systemload
      volumes:
        - name: protheus-systemload
          persistentVolumeClaim:
            claimName: protheus-systemload-pvc
