# Job de bootstrap do banco do SmartView (equivalente ao serviço smartview_db_init
# do docker-compose original, ramo "postgres" do init-smartview.sh). Roda como hook
# de fase Sync, wave 1 -- não PreSync -- justamente para poder depender de
# postgres-secret/smartview-secret/postgres-config, que são recursos normais de
# Sync (wave 0). Fazer o inverso (promover esses recursos a hook PreSync) foi
# tentado antes só pro smartview-secret e rejeitado: sem hook-delete-policy,
# Argo CD assume BeforeHookCreation e deleta+recria o SealedSecret (e o Secret
# junto, por ownerReferences) a cada sync -- medido ao vivo em 2026-09-20/21,
# ver docs/adr/0016. O Deployment smartview (base/smartview.yaml) vai na wave 2,
# depois deste Job já ter criado o banco/usuário dele.
apiVersion: batch/v1
kind: Job
metadata:
  name: smartview-db-init
  namespace: protheus-devops
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 3
  # O script tem um "until psql ...; do sleep 2; done" sem timeout próprio --
  # sem isso, um Postgres que nunca fica pronto trava o Job (e o sync) pra sempre.
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: smartview-db-init
          image: rodrigomicrosiga/smartview-infra-tools-dev:1.0
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              cat <<'SQL' > /tmp/init-smartview.sql
              DO $body$
              BEGIN
                IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = current_setting('custom.sv_user', true)) THEN
                  EXECUTE format('CREATE USER %I WITH LOGIN ENCRYPTED PASSWORD %L', current_setting('custom.sv_user'), current_setting('custom.sv_pass'));
                END IF;
              END $body$;

              SELECT 'CREATE DATABASE ' || current_setting('custom.sv_dbname') || ' WITH OWNER=' || current_setting('custom.sv_user') || ' ENCODING=''UTF8'''
              WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = current_setting('custom.sv_dbname')) \gexec

              -- GRANTs no-op enquanto SV_USER == POSTGRES_USER (o role já é dono
              -- do banco por CREATE DATABASE ... OWNER=); existem pro caso de um
              -- dia divergirem. EXECUTE só é válido dentro de um bloco DO/PL-pgSQL
              -- -- rodar solto (como antes) dava "prepared statement does not
              -- exist" e, sem ON_ERROR_STOP, o psql saía com exit 0 mesmo assim.
              -- Tag nomeada ($body$, não o $$ anônimo): o /bin/sh desta imagem
              -- é dash, que tem um bug real de parsing de heredoc -- mesmo com
              -- delimitador citado (<<'SQL', sem expansão), dash engole um dos
              -- dois $ da sequência "$$" (confirmado ao vivo via od -c: o
              -- arquivo gerado saía com "DO $"/"END $;", um $ só). $body$ não
              -- aciona esse parsing especial por não ser dois $ adjacentes.
              DO $body$
              BEGIN
                EXECUTE format('GRANT CONNECT ON DATABASE %I TO %I', current_database(), current_setting('custom.sv_user'));
                EXECUTE format('GRANT USAGE ON SCHEMA public TO %I', current_setting('custom.sv_user'));
                EXECUTE format('GRANT SELECT ON ALL TABLES IN SCHEMA public TO %I', current_setting('custom.sv_user'));
              END $body$;
              SQL
              echo "Aguardando o Postgres do cluster ficar disponivel..."
              until psql -v ON_ERROR_STOP=1 -h postgres-service.protheus-devops.svc.cluster.local -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT 1" > /dev/null 2>&1; do
                sleep 2
              done
              echo "Provisionando banco/usuario do SmartView..."
              psql -v ON_ERROR_STOP=1 -h postgres-service.protheus-devops.svc.cluster.local -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
                -c "SET custom.sv_user = '$SV_USER'; SET custom.sv_pass = '$SV_PASS'; SET custom.sv_dbname = '$SV_DBNAME';" \
                -f /tmp/init-smartview.sql
              echo "SmartView provisionado com sucesso."
          # POSTGRES_USER/POSTGRES_DB vêm do ConfigMap (não mais literais) --
          # agora que o Job é wave 1 de Sync, postgres-config já existe (era
          # PreSync que obrigava literal, ver docs/adr/0003). Conectar como o
          # superusuário do ConfigMap (postgres, não protheus) importa de
          # verdade: o role protheus é rolcreaterole=false, então o CREATE USER
          # acima nunca funcionaria de fato conectado como ele.
          envFrom:
            - configMapRef:
                name: postgres-config
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: SV_USER
              value: protheus
            - name: SV_DBNAME
              value: smartview_dev
            - name: SV_PASS
              valueFrom:
                secretKeyRef:
                  name: smartview-secret
                  key: SV_PASS
