apiVersion: apps/v1
kind: Deployment
metadata:
  name: dbaccess
  namespace: protheus-devops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dbaccess
  template:
    metadata:
      labels:
        app: dbaccess
    spec:
      containers:
        - name: dbaccess
          image: rodrigomicrosiga/dbaccess-dev:24.1.1.3
          env:
            - name: DB_SERVER
              value: "postgres-service.protheus-devops.svc.cluster.local"
            - name: DB_PORT
              value: "5432"
            - name: DB_DATABASE
              value: "protheus_prod"
          ports:
            - containerPort: 7890
---
apiVersion: v1
kind: Service
metadata:
  name: dbaccess-service
  namespace: protheus-devops
spec:
  type: NodePort
  selector:
    app: dbaccess
  ports:
    - protocol: TCP
      port: 7890
      targetPort: 7890
      nodePort: 30890