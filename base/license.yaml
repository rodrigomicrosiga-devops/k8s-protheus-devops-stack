apiVersion: apps/v1
kind: Deployment
metadata:
  name: license
  namespace: protheus-devops
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: license
  template:
    metadata:
      labels:
        app: license
    spec:
      containers:
        - name: license
          image: rodrigomicrosiga/license-dev:3.7.1
          # Requer acesso privilegiado ao host: o dmidecode empacotado na imagem lê
          # /dev/mem para gerar o fingerprint de hardware usado pela TOTVS para
          # vincular a licença. Equivalente ao docker-compose original
          # (cap_add: SYS_RAWIO + devices: /dev/mem:/dev/mem), mas sem um device
          # plugin dedicado o Kubernetes só libera o cgroup de /dev/mem via
          # privileged: true.
          #
          # Exceção documentada à migração fleet-wide non-root (2026-07-27):
          # testado em pod descartável -- mesmo com privileged:true e o usuário
          # no grupo kmem (GID do dono de /dev/mem), o kernel nega leitura pra
          # qualquer UID != 0 ("Operation not permitted"), proteção de hardening
          # que ignora permissão de grupo/capabilities pra esse device. Continua
          # root, mesmo tratamento dado ao systemd-as-PID1 do smartview.
          securityContext:
            privileged: true
          ports:
            - containerPort: 5555
            - containerPort: 8020
          readinessProbe:
            tcpSocket:
              port: 5555
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 5555
            initialDelaySeconds: 20
            periodSeconds: 15
          volumeMounts:
            - mountPath: /dev/mem
              name: dev-mem
      volumes:
        - name: dev-mem
          hostPath:
            path: /dev/mem
            type: CharDevice
---
apiVersion: v1
kind: Service
metadata:
  name: license-service
  namespace: protheus-devops
spec:
  type: NodePort
  selector:
    app: license
  ports:
    - name: license
      protocol: TCP
      port: 5555
      targetPort: 5555
      nodePort: 30555
    - name: monitor
      protocol: TCP
      port: 8020
      targetPort: 8020
      nodePort: 30820
